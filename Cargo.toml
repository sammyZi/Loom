[workspace]
resolver = "2"
members = ["core", "viewer", "sandbox", "agent", "orchestrator", "cli"]
# Built separately, after the release binary it embeds exists.
exclude = ["installer/setup"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
dunce = "1"
futures-util = "0.3"
notify = "8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rfd = { version = "0.15", features = ["common-controls-v6"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
mime_guess = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tree-sitter = "0.24"
tree-sitter-rust = "0.24"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

# Ship profile. The dev profile is untouched — this only bites on `--release`,
# where a single codegen unit plus cross-crate inlining is worth the longer
# link. `panic = "abort"` is deliberately absent: the agent loop relies on
# unwinding to survive a panicking tool call.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
